<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMP Route Tracker</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --primary: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-bg);
        }

        /* Large input for Flat Number */
        #flat {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            text-align: center;
        }

        .society-group {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background-color: var(--text-muted);
            color: white;
            border: none;
            border-radius: 8px;
            width: 50px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-size: 1rem;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Route View */
        .society-block {
            margin-bottom: 20px;
        }

        .society-title {
            background: #e5e7eb;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
        }

        .customer-card {
            background: var(--card-bg);
            padding: 15px;
            border: 1px solid var(--border);
            border-top: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .customer-card:last-child {
            border-radius: 0 0 8px 8px;
        }

        .customer-card.done {
            opacity: 0.5;
            background: #f9fafb;
        }

        .customer-card.done .flat-no {
            text-decoration: line-through;
        }

        .flat-no {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
        }

        .details {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .special-note {
            color: #d97706;
            font-weight: 500;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .btn-done {
            background-color: var(--success);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            border-top: 1px solid var(--border);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
            border-top: 3px solid var(--primary);
        }

        /* View Toggling */
        #addView, #routeView {
            display: none;
        }

        #addView.active, #routeView.active {
            display: block;
        }
    </style>
</head>
<body>

    <header>MMP Delivery</header>

    <!-- ADD CUSTOMER VIEW -->
    <div id="addView" class="container">
        <form id="addForm">
            <div class="form-group">
                <label>Route Time</label>
                <select id="route">
                    <option value="Morning">Morning (5 - 9 AM)</option>
                    <option value="Afternoon">Afternoon (10 - 11:30 AM)</option>
                    <option value="Evening">Evening (5 - 8:30 PM)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Society Name</label>
                <div class="society-group">
                    <input type="text" id="society" placeholder="e.g. Ganesh Green" required>
                    <button type="button" class="btn-icon" onclick="clearSociety()">+</button>
                </div>
            </div>

            <div class="form-group">
                <label>Flat / House Number</label>
                <input type="text" id="flat" placeholder="e.g. F 401" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Milk Quantity (Optional)</label>
                <input type="text" id="qty" placeholder="Customer batayega ya fix likho (e.g. 1.5L)">
            </div>

            <div class="form-group">
                <label>Milk Type & Method (Optional)</label>
                <input type="text" id="milkType" list="milk-options" placeholder="Gaay, Bhains, Theli, Tapeli...">
                <datalist id="milk-options">
                    <option value="Direct Tapeli">
                    <option value="Theli me parking me">
                    <option value="Gaay ka dudh">
                </datalist>
            </div>

            <div class="form-group checkbox-group">
                <label><input type="checkbox" id="kal"> Kal Dena Hai</label>
                <label><input type="checkbox" id="parso"> Parso Dena Hai</label>
            </div>

            <div class="form-group">
                <label>Special Note (Optional)</label>
                <input type="text" id="note" placeholder="e.g. Baar theli latki hse...">
            </div>

            <button type="submit" class="btn-submit">Save Entry</button>
        </form>
    </div>

    <!-- ROUTE VIEW -->
    <div id="routeView" class="container">
        <div class="form-group">
            <select id="filterRoute" onchange="renderRoute()" style="font-weight: bold; font-size: 1.1rem;">
                <option value="Morning">Morning Route</option>
                <option value="Afternoon">Afternoon Route</option>
                <option value="Evening">Evening Route</option>
            </select>
        </div>
        <div id="routeList"></div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item" id="navRoute" onclick="switchView('route')">My Route</div>
        <div class="nav-item" id="navAdd" onclick="switchView('add')">Add Entry</div>
    </div>
