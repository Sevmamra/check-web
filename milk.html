<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMP Delivery</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --primary: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-bg);
        }

        #flat {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            text-align: center;
            border: 2px solid var(--primary);
        }

        .society-group {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background-color: var(--text-main);
            color: white;
            border: none;
            border-radius: 8px;
            width: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-size: 1rem;
            font-weight: normal;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .society-block {
            margin-bottom: 20px;
        }

        .society-title {
            background: #e5e7eb;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            font-size: 1.1rem;
        }

        .customer-card {
            background: var(--card-bg);
            padding: 15px;
            border: 1px solid var(--border);
            border-top: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .customer-card:last-child {
            border-radius: 0 0 8px 8px;
        }

        .customer-card.done {
            opacity: 0.5;
            background: #f9fafb;
        }

        .customer-card.done .flat-no {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .flat-no {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
        }

        .details {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        .special-note {
            color: #d97706;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Naya Action Group jisme liter ka box aur tick button hai */
        .action-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .daily-qty-input {
            width: 70px;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            background: #f8fafc;
        }

        .daily-qty-input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn-done {
            background-color: var(--success);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Total aur Reset Section */
        .route-summary {
            background: var(--card-bg);
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            border: 2px dashed var(--border);
            text-align: center;
        }

        .total-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        #routeTotalDisplay {
            color: var(--primary);
            font-size: 1.5rem;
        }

        .btn-reset {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .nav-item.active {
            color: var(--primary);
            border-top: 4px solid var(--primary);
            background: #eff6ff;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>MMP Delivery</header>

    <!-- ADD CUSTOMER VIEW -->
    <div id="addView" class="view-section active container">
        <form id="addForm">
            <div class="form-group">
                <label>Route Time</label>
                <select id="route">
                    <option value="Morning">Morning (5 - 9 AM)</option>
                    <option value="Afternoon">Afternoon (10 - 11:30 AM)</option>
                    <option value="Evening">Evening (5 - 8:30 PM)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Society Name</label>
                <div class="society-group">
                    <input type="text" id="society" placeholder="  " required>
                    <button type="button" class="btn-icon" onclick="clearSociety()">+</button>
                </div>
            </div>

            <div class="form-group">
                <label>Flat / House Number</label>
                <input type="text" id="flat" placeholder=". " required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Milk Quantity (Optional)</label>
                <input type="text" id="qty" placeholder="Fix likho (e.g. 1.5L) varna khali chhodo" autocomplete="off">
            </div>

            <div class="form-group">
                <label>Milk Type & Method (Optional)</label>
                <input type="text" id="milkType" list="milk-options" placeholder="Gaay, Theli, Tapeli, Parking..." autocomplete="off">
                <datalist id="milk-options">
                    <option value="Direct Tapeli">
                    <option value="Theli me parking me">
                    <option value="Gaay ka dudh">
                </datalist>
            </div>

            <div class="form-group checkbox-group">
                <label><input type="checkbox" id="kal"> Kal nai</label>
                <label><input type="checkbox" id="parso"> Parso nai</label>
            </div>

            <div class="form-group">
                <label>Special Note (Optional)</label>
                <input type="text" id="note" placeholder="e.g. 1 din chhod kar..." autocomplete="off">
            </div>

            <button type="submit" class="btn-submit">Save Entry</button>
        </form>
    </div>

    <!-- ROUTE VIEW -->
    <div id="routeView" class="view-section container">
        <div class="form-group">
            <select id="filterRoute" onchange="renderRoute()" style="font-weight: bold; font-size: 1.2rem; background: #eff6ff; color: #2563eb; border-color: #2563eb;">
                <option value="Morning">Morning Route</option>
                <option value="Afternoon">Afternoon Route</option>
                <option value="Evening">Evening Route</option>
            </select>
        </div>
        <div id="routeList"></div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item" id="navRoute" onclick="switchView('route')">My Route</div>
        <div class="nav-item active" id="navAdd" onclick="switchView('add')">Add Entry</div>
    </div>

    <script>
        let customers = [];

        function initApp() {
            try {
                const storedData = localStorage.getItem('mmp_delivery_data');
                if (storedData) {
                    customers = JSON.parse(storedData);
                }
            } catch (error) {
                console.error("Data load error:", error);
                customers = [];
            }
            
            if (customers.length > 0) {
                switchView('route');
            } else {
                switchView('add');
            }
        }

        function clearSociety() {
            const socInput = document.getElementById('society');
            socInput.value = '';
            socInput.focus();
        }

        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newCustomer = {
                id: Date.now(),
                route: document.getElementById('route').value,
                society: document.getElementById('society').value.trim(),
                flat: document.getElementById('flat').value.trim(),
                qty: document.getElementById('qty').value.trim(),
                milkType: document.getElementById('milkType').value.trim(),
                kal: document.getElementById('kal').checked,
                parso: document.getElementById('parso').checked,
                note: document.getElementById('note').value.trim(),
                status: 'pending',
                dailyQty: '' // Naya variable daily entry save karne ke liye
            };

            customers.push(newCustomer);
            localStorage.setItem('mmp_delivery_data', JSON.stringify(customers));

            document.getElementById('flat').value = '';
            document.getElementById('qty').value = '';
            document.getElementById('milkType').value = '';
            document.getElementById('kal').checked = false;
            document.getElementById('parso').checked = false;
            document.getElementById('note').value = '';

            document.getElementById('flat').focus();
        });

        // Daily doodh ki entry real-time save hogi
        function updateDailyQty(id, val) {
            const index = customers.findIndex(c => c.id === id);
            if (index > -1) {
                customers[index].dailyQty = val;
                localStorage.setItem('mmp_delivery_data', JSON.stringify(customers));
                updateTotal();
            }
        }

        function toggleStatus(id) {
            const index = customers.findIndex(c => c.id === id);
            if (index > -1) {
                customers[index].status = customers[index].status === 'done' ? 'pending' : 'done';
                localStorage.setItem('mmp_delivery_data', JSON.stringify(customers));
                renderRoute();
            }
        }

        // Total count calculate karega sirf 'done' status walo ka
        function updateTotal() {
            const currentRoute = document.getElementById('filterRoute').value;
            const filtered = customers.filter(c => c.route === currentRoute);
            let total = 0;
            
            filtered.forEach(c => {
                if (c.status === 'done' && c.dailyQty) {
                    let parsedVal = parseFloat(c.dailyQty);
                    if (!isNaN(parsedVal)) {
                        total += parsedVal;
                    }
                }
            });

            const totalDisplay = document.getElementById('routeTotalDisplay');
            if (totalDisplay) {
                totalDisplay.innerText = total + " Ltr";
            }
        }

        // Din khatam hone par sab reset karne ka function (Customers delete nahi honge)
        function closeDay() {
            if (confirm("Kya aap sach me aaj ka din close karna chahte hain? Sabhi ✔ ticks aur daily liter entries kal ke liye clear ho jayengi.")) {
                customers.forEach(c => {
                    c.status = 'pending';
                    c.dailyQty = ''; // Clear daily input
                });
                localStorage.setItem('mmp_delivery_data', JSON.stringify(customers));
                renderRoute();
            }
        }

        function renderRoute() {
            const listDiv = document.getElementById('routeList');
            const currentRoute = document.getElementById('filterRoute').value;
            
            const filtered = customers.filter(c => c.route === currentRoute);
            
            if (filtered.length === 0) {
                listDiv.innerHTML = '<div class="empty-state">Is route mein koi entry nahi hai. Nayi entry add karein.</div>';
                return;
            }

            const grouped = {};
            filtered.forEach(c => {
                if (!grouped[c.society]) grouped[c.society] = [];
                grouped[c.society].push(c);
            });

            let html = '';
            for (const society in grouped) {
                html += `<div class="society-block"><div class="society-title">${society}</div>`;
                
                grouped[society].forEach(c => {
                    const doneClass = c.status === 'done' ? 'done' : '';
                    let detailsArr = [];
                    if (c.qty) detailsArr.push("Fix: " + c.qty);
                    if (c.milkType) detailsArr.push(c.milkType);
                    
                    let daysInfo = [];
                    if (c.kal) daysInfo.push('Kal dena hai');
                    if (c.parso) daysInfo.push('Parso dena hai');
                    if (daysInfo.length > 0) detailsArr.push(`[${daysInfo.join(', ')}]`);

                    html += `
                        <div class="customer-card ${doneClass}">
                            <div style="flex: 1; padding-right: 10px;">
                                <div class="flat-no">${c.flat}</div>
                                ${detailsArr.length > 0 ? `<div class="details">${detailsArr.join(' | ')}</div>` : ''}
                                ${c.note ? `<div class="special-note">⚠️ ${c.note}</div>` : ''}
                            </div>
                            <div class="action-group">
                                <input type="number" step="0.25" class="daily-qty-input" placeholder="Ltr" value="${c.dailyQty || ''}" oninput="updateDailyQty(${c.id}, this.value)">
                                <button class="btn-done" onclick="toggleStatus(${c.id})">✔</button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            // Total section aur reset button HTML me add kiya hai
            html += `
                <div class="route-summary">
                    <div class="total-text">Aaj Ka Total Delivery: <br><span id="routeTotalDisplay">0 Ltr</span></div>
                    <button class="btn-reset" onclick="closeDay()">Close This Day (Reset Route)</button>
                </div>
            `;

            listDiv.innerHTML = html;
            updateTotal(); // Naya render hone par bhi total update dikhega
        }

        function switchView(view) {
            document.getElementById('addView').classList.remove('active');
            document.getElementById('routeView').classList.remove('active');
            document.getElementById('navAdd').classList.remove('active');
            document.getElementById('navRoute').classList.remove('active');

            if (view === 'add') {
                document.getElementById('addView').classList.add('active');
                document.getElementById('navAdd').classList.add('active');
                
                const savedRoute = document.getElementById('filterRoute').value;
                document.getElementById('route').value = savedRoute;
            } else {
                document.getElementById('routeView').classList.add('active');
                document.getElementById('navRoute').classList.add('active');
                
                const formRoute = document.getElementById('route').value;
                document.getElementById('filterRoute').value = formRoute;
                renderRoute();
            }
        }

        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
    </html>
